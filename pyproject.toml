[project]
name = "shipr"
version = "0.1.0"
description = "Git-aware deployment CLI: ship an exact commit to your servers over SFTP, safely."
readme = "README.md"
license = "MIT"
# 3.10.0-3.10.11 and 3.11.0-3.11.3 lack tarfile extraction filters (safe git export)
requires-python = ">=3.10.12, !=3.11.0, !=3.11.1, !=3.11.2, !=3.11.3"
authors = [{ name = "shipr contributors" }]
keywords = ["deploy", "sftp", "git", "cli", "devops"]
classifiers = [
  "Environment :: Console",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Topic :: Software Development :: Build Tools",
]
dependencies = [
  "click>=8.1",
  "paramiko>=3.4",
  "pathspec>=0.12",
  "pydantic>=2.6",
  "python-dotenv>=1.0",
  "pyyaml>=6.0",
]

[project.scripts]
shipr = "shipr.cli:main"

[project.entry-points."shipr.providers"]
sftp = "shipr.providers.sftp:SFTPProvider"
local = "shipr.providers.local:LocalProvider"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.5"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: needs Docker (SFTP server container)"]
addopts = "-m 'not integration'"
