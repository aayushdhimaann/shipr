name: ci
on: [push, pull_request]

# Actions are pinned to commit SHAs (tag in the comment): a moved or compromised tag can't change
# what runs here. Bump them deliberately.

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python: ["3.10", "3.11", "3.12", "3.13", "3.14"]  # newest patch release of each
        include:
          # the oldest supported patch releases: the first with tarfile extraction filters,
          # which the git export needs (requires-python excludes everything older)
          - {os: ubuntu-latest, python: "3.10.12"}
          - {os: ubuntu-latest, python: "3.11.4"}
          # Windows: oldest and newest, plus 3.12, where Python's own junction detection
          # changed (shipr treats junctions as symlinks on every version). Runs the
          # Windows-only junction test and the taskkill /T process-tree test.
          - {os: windows-latest, python: "3.10"}
          - {os: windows-latest, python: "3.12"}
          - {os: windows-latest, python: "3.14"}
          - {os: macos-latest, python: "3.10"}
          - {os: macos-latest, python: "3.14"}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d  # v10.4.0
      - run: uv sync --locked --python ${{ matrix.python }}
      - run: uv run python -c "import sys; print(sys.version)"
      - run: uv run ruff check src tests scripts
      - run: uv run pytest -rs

  integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d  # v10.4.0
      - run: uv sync --locked
      - run: uv run pytest -m integration -rs

  # Build the wheel and sdist, install each in a clean environment (not this checkout), and
  # run the installed CLI. Nothing is published.
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d  # v10.4.0
      - run: uv build
      - run: uv run --no-project python scripts/smoke_installed.py --dist dist
      - name: wheel, oldest supported Python
        run: |
          uv venv --python 3.10.12 "$RUNNER_TEMP/wheel"
          uv pip install --python "$RUNNER_TEMP/wheel" dist/*.whl
          uv run --no-project python scripts/smoke_installed.py --dist dist --venv "$RUNNER_TEMP/wheel"
      - name: sdist with pip, newest Python
        run: |
          uv venv --seed --python 3.14 "$RUNNER_TEMP/sdist"
          "$RUNNER_TEMP/sdist/bin/python" -m pip install dist/*.tar.gz
          uv run --no-project python scripts/smoke_installed.py --dist dist --venv "$RUNNER_TEMP/sdist"
