name: ci
on: [push, pull_request]

# Actions are pinned to commit SHAs (tag in the comment): a moved or compromised tag can't change
# what runs here. Bump them deliberately.

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python: ["3.10", "3.11", "3.12", "3.13", "3.14"]  # every supported version
        include:
          # Windows: oldest and newest, plus 3.12, where Python's own junction detection
          # changed (shipr treats junctions as symlinks on every version)
          - {os: windows-latest, python: "3.10"}
          - {os: windows-latest, python: "3.12"}
          - {os: windows-latest, python: "3.14"}
          - {os: macos-latest, python: "3.10"}
          - {os: macos-latest, python: "3.14"}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86  # v5.4.2
      - run: uv sync --locked --python ${{ matrix.python }}
      - run: uv run ruff check src tests
      - run: uv run pytest -rs

  # P-2 probe: tarfile's extraction filter (used for the git export) only exists from 3.10.12 /
  # 3.11.4. This job shows whether an older patch release breaks; it doesn't block CI until
  # Phase 3F decides between a version floor and a fallback.
  old-patch-release:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86  # v5.4.2
      - run: uv sync --locked --python 3.10.11
      - run: uv run pytest -rs

  integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86  # v5.4.2
      - run: uv sync --locked
      - run: uv run pytest -m integration -rs
