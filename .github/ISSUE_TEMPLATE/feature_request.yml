name: Feature request
description: Suggest a change to how shipr works.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: What are you trying to do, and what gets in the way today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behaviour
      description: Including what happens on failure, and whether it could overwrite or delete files on the server.
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives you've considered
